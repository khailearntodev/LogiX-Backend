name: Backend CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "libs/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/**"
      - "libs/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate workspace manifests
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            identity-service
            master-data-service
            inventory-service
            order-service
            fulfillment-service
            transport-service
            notification-service
            audit-service
          )

          for service in "${services[@]}"; do
            test -f "apps/$service/package.json" || {
              echo "Missing package.json: apps/$service"
              exit 1
            }
          done

          test -f package.json
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate NestJS Prisma schemas
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logix_ci
        run: |
          set -euo pipefail

          services=(
            identity-service
            master-data-service
            inventory-service
            order-service
            fulfillment-service
            transport-service
            notification-service
            audit-service
          )

          for service in "${services[@]}"; do
            service_dir="apps/$service"

            test -f "$service_dir/prisma.config.ts" || {
              echo "Missing Prisma config: $service_dir/prisma.config.ts"
              exit 1
            }

            test -f "$service_dir/prisma/schema.prisma" || {
              echo "Missing Prisma schema: $service_dir/prisma/schema.prisma"
              exit 1
            }

            echo "Validating Prisma schema for $service"
            pnpm --dir "$service_dir" exec prisma validate
          done

      - name: Lint NestJS services
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            identity-service
            master-data-service
            inventory-service
            order-service
            fulfillment-service
            transport-service
            notification-service
            audit-service
          )

          for service in "${services[@]}"; do
            echo "Linting $service"
            pnpm --dir "apps/$service" run lint
          done

      - name: Build NestJS services
        shell: bash
        run: |
          set -euo pipefail

          services=(
            api-gateway
            identity-service
            master-data-service
            inventory-service
            order-service
            fulfillment-service
            transport-service
            notification-service
            audit-service
          )

          for service in "${services[@]}"; do
            echo "Building $service"
            pnpm --dir "apps/$service" run build
          done

      - name: Run available NestJS tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          test_files=(apps/*/test/**/*.ts apps/*/test/**/*.tsx)
          if (( ${#test_files[@]} == 0 )); then
            echo "No NestJS test files found; skipping test step."
            exit 0
          fi

          for package_json in apps/*/package.json; do
            service_dir="${package_json%/package.json}"
            if node -e "const p=require('./$package_json'); process.exit(p.scripts?.test ? 0 : 1)"; then
              echo "Testing $service_dir"
              pnpm --dir "$service_dir" run test -- --run
            fi
          done
  python-databases:
    name: Validate Python database services
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-service
            package: logix_agent
            database: logix_agent
          - service: forecast-service
            package: logix_forecast
            database: logix_forecast
          - service: route-optimizer-service
            package: logix_route_optimizer
            database: logix_route_optimizer

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/${{ matrix.database }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/pyproject.toml

      - name: Validate Python database layout
        shell: bash
        run: |
          set -euo pipefail
          service_dir="apps/${{ matrix.service }}"
          package_dir="$service_dir/src/${{ matrix.package }}"

          test -f "$service_dir/pyproject.toml" || {
            echo "Missing Python project manifest: $service_dir/pyproject.toml"
            exit 1
          }

          test -d "$package_dir" || {
            echo "Missing package $package_dir. Python services must use their unique src package (docs/decisions/0002-python-service-source-layout.md)."
            exit 1
          }

          legacy_module="$(find "$service_dir/app" -type f -name '*.py' -print -quit 2>/dev/null || true)"
          test -z "$legacy_module" || {
            echo "Forbidden legacy Python module: $legacy_module. Move code under $package_dir (docs/decisions/0002-python-service-source-layout.md)."
            exit 1
          }

          required_paths=(
            "$package_dir/db/base.py"
            "$package_dir/db/session.py"
            "$package_dir/db/model_registry.py"
            "$package_dir/modules"
            "$service_dir/alembic.ini"
            "$service_dir/migrations"
          )

          for required_path in "${required_paths[@]}"; do
            test -e "$required_path" || {
              echo "Missing database layout path: $required_path (docs/decisions/0001-python-persistence-sqlalchemy-alembic.md and docs/decisions/0002-python-service-source-layout.md)."
              exit 1
            }
          done

      - name: Install Python service
        working-directory: apps/${{ matrix.service }}
        run: python -m pip install -e ".[test]"

      - name: Compile Python source
        working-directory: apps/${{ matrix.service }}
        run: python -m compileall -q src

      - name: Verify package and model registry imports
        working-directory: apps/${{ matrix.service }}
        run: |
          python -c "import importlib; importlib.import_module('${{ matrix.package }}'); importlib.import_module('${{ matrix.package }}.db.model_registry')"

      - name: Run Python database tests
        working-directory: apps/${{ matrix.service }}
        run: python -W error -m pytest -q

      - name: Validate clean migration and schema drift
        working-directory: apps/${{ matrix.service }}
        run: |
          python -m alembic upgrade head
          python -m alembic check
